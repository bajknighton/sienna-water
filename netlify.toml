[build]
  # Files were uploaded without folders, so sort them into place during the build.
  command = "mkdir -p dist/icons netlify/functions netlify/lib && cp index.html app.js sw.js manifest.webmanifest dist/ && cp *.png lion.svg dist/icons/ && cp api.mjs tick.mjs netlify/functions/ && cp core.mjs schedule.mjs netlify/lib/"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"
